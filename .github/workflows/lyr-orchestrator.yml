name: LYR orchestrator dry-run tests

on:
  pull_request:
    paths:
      - "runtime/orchestrator/**"
      - "runtime/authority/**"
      - "tools/free_engine/**"
      - "tests/test_lyr_orchestrator.py"
      - ".github/workflows/lyr-orchestrator.yml"
  push:
    branches: [main]
    paths:
      - "runtime/orchestrator/**"
      - "runtime/authority/**"
      - "tools/free_engine/**"
      - "tests/test_lyr_orchestrator.py"
      - ".github/workflows/lyr-orchestrator.yml"

permissions:
  contents: read

jobs:
  dry-run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run FREE, authority, and orchestrator tests
        run: python -m unittest tests.test_lyr_authority tests.test_lyr_orchestrator -v
