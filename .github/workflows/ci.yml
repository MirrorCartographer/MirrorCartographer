name: Mirror Cartographer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify complete HTML workbench coverage
        run: npm run verify:workbench

      - name: Run FREE 2.0, authority, and LYR orchestrator tests
        run: |
          python -m unittest tests.test_lyr_authority tests.test_lyr_orchestrator -v

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
