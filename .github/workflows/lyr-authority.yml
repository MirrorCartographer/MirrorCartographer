name: LYR authority gate

on:
  pull_request:
    paths:
      - "governance/lyr-autonomy-authority.v1.json"
      - "runtime/authority/**"
      - "tests/test_lyr_authority.py"
      - ".github/workflows/lyr-authority.yml"
  push:
    branches: [main]
    paths:
      - "governance/lyr-autonomy-authority.v1.json"
      - "runtime/authority/**"
      - "tests/test_lyr_authority.py"
      - ".github/workflows/lyr-authority.yml"

permissions:
  contents: read

jobs:
  authority-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run LYR authority tests
        run: python -m unittest tests.test_lyr_authority -v
