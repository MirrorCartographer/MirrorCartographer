name: Night Shift actual browser inference proof
on:
  workflow_run:
    workflows:
      - Publish Mirror Cartographer Living Atlas
    types:
      - completed
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  browser-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser acceptance tooling
        run: |
          npm install --no-save playwright@1.58.1
          npx playwright install --with-deps chromium
      - name: Exercise published on-device inference in a real browser
        run: node site/between-device-browser-smoke.cjs
      - name: Preserve failure screenshot if the browser could not generate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: night-shift-browser-failure
          path: night-shift-browser-failure.png
          if-no-files-found: ignore
          retention-days: 7
