name: Archive manifest tests
on:
  push:
    paths:
      - 'tools/build_archive_manifest.py'
      - 'tests/test_archive_manifest.py'
      - '.github/workflows/archive-manifest-tests.yml'
  pull_request:
    paths:
      - 'tools/build_archive_manifest.py'
      - 'tests/test_archive_manifest.py'
      - '.github/workflows/archive-manifest-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run archive manifest unit tests
        run: python -m unittest discover -s tests -p 'test_archive_manifest.py' -v
