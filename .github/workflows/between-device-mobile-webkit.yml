name: Night Shift mobile WebKit acceptance
on:
  workflow_run:
    workflows:
      - Publish Mirror Cartographer Living Atlas
    types:
      - completed
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  webkit-mobile:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported WebKit mobile test environment
        run: |
          npm install --no-save playwright@1.58.1
          npx playwright install --with-deps webkit
      - name: Test actual published mobile WebKit model inference
        run: node site/between-device-mobile-webkit-smoke.cjs
      - name: Preserve observable mobile browser failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: night-shift-webkit-failure
          path: night-shift-webkit-failure.png
          if-no-files-found: ignore
          retention-days: 7
