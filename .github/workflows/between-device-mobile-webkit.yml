name: Night Shift mobile WebKit acceptance
on:
  push:
    branches: [main]
    paths:
      - 'site/expeditions/between-device*.mjs'
      - 'site/expeditions/lyr-evidence-protocol.mjs'
      - 'site/expeditions/between-device.html'
      - 'site/between-device-mobile-webkit-smoke.cjs'
      - '.github/workflows/between-device-mobile-webkit.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  webkit-mobile:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use the matching prebuilt Playwright browser and dependencies
        run: |
          npm install --no-save playwright@1.58.1
      - name: Test actual published mobile WebKit model inference
        run: node site/between-device-mobile-webkit-smoke.cjs
      - name: Preserve observable mobile browser failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: night-shift-webkit-failure
          path: night-shift-webkit-failure.png
          if-no-files-found: ignore
          retention-days: 7
