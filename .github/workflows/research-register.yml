name: Research register integrity
on:
  push:
    paths:
      - "research/**"
      - ".github/workflows/research-register.yml"
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/research-register.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate source and claim references
        run: python research/validate_claim_register.py
      - name: Verify interface bindings against the canonical register
        run: node ui-repo/scripts/validate-claim-ui-bindings.mjs research/claim-register.json ui-repo/public/research-atlas/index.html
