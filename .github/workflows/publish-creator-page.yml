name: Publish creator page

on:
  push:
    branches: [main]
    paths:
      - "site/creator/**"
      - ".github/workflows/publish-creator-page.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: creator-page-publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish creator page to the configured Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site/creator
          force_orphan: false
          commit_message: "Publish creator page from ${{ github.sha }}"
