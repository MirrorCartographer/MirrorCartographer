name: Mirror Engine Core Tests
on:
  push:
    branches: [main]
    paths:
      - 'tools/free_engine/**'
      - 'mirror_engine/**'
      - 'independent_model/**'
      - '.github/workflows/mirror-engine-tests.yml'
  pull_request:
    paths:
      - 'tools/free_engine/**'
      - 'mirror_engine/**'
      - 'independent_model/**'
      - '.github/workflows/mirror-engine-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test FREE 2.0
        working-directory: tools/free_engine
        run: python -m unittest -v
      - name: Test Mirror provenance store
        working-directory: mirror_engine
        run: python -m unittest -v
      - name: Compile independent model implementation
        run: python -m py_compile independent_model/model.py independent_model/train.py independent_model/infer.py
