name: Platform-limit workflow run inventory validation

on:
  pull_request:
    paths:
      - "tools/platform_limit_investigator/run_inventory/**"
      - ".github/workflows/platform-limit-run-inventory.yml"
  push:
    branches:
      - "investigation/**"
    paths:
      - "tools/platform_limit_investigator/run_inventory/**"
      - ".github/workflows/platform-limit-run-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s tools/platform_limit_investigator/run_inventory/tests -v
      - name: Compile validator and tests
        run: python -m py_compile tools/platform_limit_investigator/run_inventory/validate_run_inventory.py tools/platform_limit_investigator/run_inventory/tests/test_validate_run_inventory.py
      - name: Confirm expected synthetic omission is detected
        run: python tools/platform_limit_investigator/run_inventory/validate_run_inventory.py tools/platform_limit_investigator/run_inventory/examples/synthetic_run_inventory.json --expect-missing 1003
