name: Publish Mirror Cartographer Living Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mirror-cartographer-canonical-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/validate-site.mjs
      - run: node --check site/generate-catalog.mjs
      - name: Checkout companion application source
        run: git clone --depth 1 https://github.com/MirrorCartographer/mirror-cartographer-ui.git ui-repository
      - name: Generate catalog across both repositories
        run: node site/generate-catalog.mjs
      - name: Prepare site
        run: |
          touch site/.nojekyll
          mkdir -p site/worlds/unreliable-observatory
          cp independent-site/index.html site/worlds/unreliable-observatory/index.html
          cp independent-site/identity.json site/worlds/unreliable-observatory/identity.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4