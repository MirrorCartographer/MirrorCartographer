name: Publish Mirror Cartographer Living Atlas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mirror-cartographer-canonical-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test site/atlas-privacy-policy.test.mjs
      - run: node site/validate-site.mjs
      - run: node --check site/generate-catalog.mjs
      - run: node --check site/validate-catalog.mjs
      - run: node --check site/validate-public-routes.mjs
      - run: node --check site/companion/atlas/rooms/character-atelier/character-engine.mjs
      - run: node --test tests/character-atelier-public.test.mjs
      - name: Generate the public-site catalog from reviewed artifacts
        run: node site/generate-catalog.mjs
      - name: Validate catalog schema, uniqueness, and privacy exclusions
        run: node site/validate-catalog.mjs
      - name: Prepare site
        run: |
          touch site/.nojekyll
          mkdir -p site/worlds/unreliable-observatory site/experiments site/music
          cp independent-site/index.html site/worlds/unreliable-observatory/index.html
          cp independent-site/identity.json site/worlds/unreliable-observatory/identity.json
          cp -R public/experiments/. site/experiments/
          cp -R public/music/. site/music/
          mkdir -p site/forest
          cp -R public/forest/. site/forest/
          node site/validate-public-routes.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4