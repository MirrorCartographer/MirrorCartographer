<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Garden · Mirror Cartographer</title><style>body{margin:0;background:#151326;color:#eee9f6;font:17px/1.6 system-ui}main{max-width:780px;margin:auto;padding:32px 20px}a{color:#e3c9ef}.card{background:#211c32;border:1px solid #9277a9;border-radius:24px;padding:24px;margin:20px 0}h1{font:clamp(3rem,9vw,5rem)/1 Georgia}.signal{border-left:3px solid #bda0d4;padding:12px 16px;background:#302742;border-radius:8px}.choices{display:grid;gap:10px}button{font:inherit;text-align:left;padding:14px;border:1px solid #9b80ad;background:#302742;color:white;border-radius:12px;cursor:pointer}#status{min-height:3em}</style><main><a href="./the-between.html">← The Between</a><p>WORLD B · SIDE ROOM 01</p><h1>Signal<br>Garden</h1><p>Separate what was observed from what was inferred. These are practice scenarios, not tests of anyone's character.</p><section class="card"><p id="count">SIGNAL 1 OF 3</p><div class="signal" id="scene"></div><h2>Which response keeps the signal most accurate?</h2><div class="choices" id="choices"></div><p id="status" role="status" aria-live="polite"></p><button id="next" hidden>Next signal →</button></section><p id="score">Clear signals: 0 / 3</p><script>const data=[{s:"They read your message and haven't replied for two hours.",c:["They don't respect me.","They may be busy; I don't know why they haven't replied.","They're deliberately punishing me."],a:1,e:"You kept the observation separate from possible explanations."},{s:"A friend says, “I need a quiet evening.”",c:["They don't want to see me anymore.","They asked for quiet tonight; I can ask about another day.","They're rejecting our friendship."],a:1,e:"A boundary about tonight is not automatically a verdict on the whole relationship."},{s:"Someone looks away while you are speaking.",c:["They are bored with me.","They looked away. I can check whether they are still following.","They are being disrespectful."],a:1,e:"You noticed behavior without pretending to know the other person's internal state."}];let i=0,score=0,locked=false;const $=x=>document.getElementById(x);function draw(){$("count").textContent="SIGNAL "+(i+1)+" OF 3";$("scene").textContent=data[i].s;$("choices").innerHTML=data[i].c.map((x,n)=>'<button data-n="'+n+'">'+x+'</button>').join("");[...$("choices").children].forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const ok=+b.dataset.n===data[i].a;if(ok)score++;$("status").textContent=(ok?"Clear distinction. ":"That answer assumes more than the evidence shows. ")+data[i].e;$("score").textContent="Clear signals: "+score+" / 3";$("next").hidden=false});$("status").textContent="";$("next").hidden=true;locked=false} $("next").onclick=()=>{if(i<2){i++;draw()}else{$("scene").textContent="A garden of signals, not assumptions.";$("choices").innerHTML="";$("status").textContent="Practice complete. Accuracy leaves room for curiosity.";$("next").hidden=true}};draw();</script></main></html>
