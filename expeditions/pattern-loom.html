<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Loom · Mirror Cartographer</title><style>body{margin:0;background:#19140f;color:#f4ead9;font:17px/1.6 system-ui}main{max-width:760px;margin:auto;padding:32px 20px}a{color:#f1d6a5}.card{background:#241d16;border:1px solid #8e7048;border-radius:22px;padding:24px;margin:20px 0}h1{font:clamp(3rem,9vw,5rem)/1 Georgia}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile,button{border:1px solid #b38d57;background:#3b2b1c;color:#fff3dc;border-radius:14px;padding:16px;font:inherit}.tile{font:2rem Georgia;text-align:center}.choices{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer}#status{min-height:2em}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><main><a href="./riddle-arcade.html">← Riddle Arcade</a><p>WORLD R · SIDE ROOM 01</p><h1>Pattern<br>Loom</h1><p>Find the rule woven through each row. Choose the rule that predicts the next tile.</p><section class="card"><p id="round">LOOM 1 OF 3</p><div class="tiles" id="tiles"></div><h2>What comes next?</h2><div class="choices" id="choices"></div><p id="status" role="status" aria-live="polite"></p><button id="hint">Reveal a hint</button> <button id="next" hidden>Next weave →</button></section><p id="score">Threads found: 0 / 3</p><script>const rounds=[{seq:["●","○","●","○","●","?"],opts:["●","○","◆"],answer:"○",hint:"The filled and empty circles alternate."},{seq:["▲","▲▲","▲▲▲","?"],opts:["▲▲","▲▲▲▲","▲▲▲▲▲"],answer:"▲▲▲▲",hint:"One triangle is added each time."},{seq:["◆","◇","◇","◆","◇","◇","?"],opts:["◆","◇","○"],answer:"◆",hint:"A three-part cycle repeats: filled, outline, outline."}];let i=0,score=0,done=false;const $=x=>document.getElementById(x);function draw(){done=false;$("round").textContent="LOOM "+(i+1)+" OF 3";$("tiles").innerHTML=rounds[i].seq.map(x=>'<div class="tile">'+x+'</div>').join("");$("choices").innerHTML=rounds[i].opts.map(x=>'<button>'+x+'</button>').join("");[...$("choices").children].forEach(b=>b.onclick=()=>{if(done)return;done=true;if(b.textContent===rounds[i].answer){score++;$("status").textContent="The weave holds. You found the rule."}else $("status").textContent="That rule doesn't predict the whole row. Try the hint or continue."; $("score").textContent="Threads found: "+score+" / 3";$("next").hidden=false});$("status").textContent="";$("next").hidden=true;$("hint").onclick=()=>$("status").textContent=rounds[i].hint} $("next").onclick=()=>{if(i<2){i++;draw()}else{$("tiles").innerHTML="✦";$("choices").innerHTML="";$("status").textContent="You found "+score+" of 3 patterns. Every wrong turn was information.";$("next").hidden=true}};draw();</script></main></html>
