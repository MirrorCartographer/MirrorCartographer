<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecology Lab · Mirror Cartographer</title><style>body{margin:0;background:#101812;color:#e7eadc;font:17px/1.6 system-ui}main{max-width:780px;margin:auto;padding:32px 20px}a{color:#c9dda9}.card{background:#17251d;border:1px solid #66846a;border-radius:24px;padding:24px;margin:20px 0}h1{font:clamp(3rem,9vw,5rem)/1 Georgia}.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.meter{background:#0e1912;padding:14px;border-radius:14px}.meter strong{display:block;font-size:1.6rem}button{font:inherit;padding:12px 16px;border-radius:12px;border:1px solid #78936c;background:#233528;color:#f2f0df;cursor:pointer;margin:5px}#status{min-height:3em}</style><main><a href="./specimen-garden.html">← Specimen Garden</a><p>WORLD S · SIDE ROOM 01</p><h1>Ecology<br>Lab</h1><p>A tiny ecosystem is not a collection of independent parts. Change one resource and watch the others respond. Find a stable balance—not a maximum score.</p><section class="card"><div class="meters"><div class="meter">Water<strong id="water">5</strong></div><div class="meter">Light<strong id="light">5</strong></div><div class="meter">Moss<strong id="moss">5</strong></div></div><h2>A new habitat</h2><p>Choose one intervention.</p><div id="actions"><button data-action="rain">Invite rain</button><button data-action="shade">Grow canopy</button><button data-action="spores">Release spores</button></div><p id="status" role="status" aria-live="polite"></p><button id="reset">Reset ecosystem</button></section><p id="turn">Season 0 / 5</p><script>let v={water:5,light:5,moss:5},turn=0;const $=x=>document.getElementById(x);const changes={rain:{water:3,light:-1,moss:1},shade:{water:-1,light:-2,moss:2},spores:{water:-1,light:0,moss:3}};function render(){for(const k in v)$(k).textContent=v[k];$("turn").textContent="Season "+turn+" / 5"}function act(a){if(turn>=5)return;for(const k in v)v[k]=Math.max(0,Math.min(10,v[k]+changes[a][k]));turn++;const balanced=Object.values(v).every(n=>n>=3&&n<=7);$("status").textContent=balanced?"The habitat is within its stable band. Stability is a range, not a single perfect number.":"The ecosystem shifted. Notice which resource became scarce or abundant.";if(turn===5)$("status").textContent+=(balanced?" You maintained a balanced habitat.":" Experiment complete. Different interventions create different trade-offs.");render()}document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>act(b.dataset.action));$("reset").onclick=()=>{v={water:5,light:5,moss:5};turn=0;$("status").textContent="A fresh ecosystem begins.";render()};render();</script></main></html>
