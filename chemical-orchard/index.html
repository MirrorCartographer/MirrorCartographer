      <path d="M90 980C-20 500 300 345 175-70M160 920C70 600 340 480 345 115M1280 930C1420 600 1080 405 1250-90"/>

    <g fill="#ced793" opacity=".16"><ellipse cx="130" cy="380" rx="29" ry="85" transform="rotate(34 130 380)"/><ellipse cx="332" cy="252" rx="20" ry="66" transform="rotate(45 332 252)"/><ellipse cx="1176" cy="382" rx="31" ry="75" transform="rotate(-34 1176 382)"/></g>

  <div class="film" aria-hidden="true"></div>

    <div class="specimen-stamp" aria-hidden="true">DO NOT<br>FEED<br>THE GLASS</div>
