<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veteran Mission · Rebuild the Map</title><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#edf7ff;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(920px,94vw);padding:34px 0 70px}.ey{font-size:.7rem;letter-spacing:.2em;color:#7ed8ff}.top{display:flex;justify-content:space-between;gap:20px}h1{font-size:clamp(3rem,9vw,7rem);line-height:.8;letter-spacing:-.07em;margin:.4rem 0}.lede{max-width:650px;color:#a7bac6}.stats{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.stat{padding:9px 13px;border:1px solid #ffffff18;border-radius:999px;background:#ffffff07}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.node{min-height:135px;border:1px solid #ffffff18;border-radius:20px;background:#ffffff08;color:#fff;padding:16px;text-align:left;cursor:pointer}.node:hover,.node.active{background:#7ed8ff;color:#061018}.node small{display:block;opacity:.55;margin-bottom:9px}.mission{min-height:105px;padding:18px;border:1px solid #ffffff15;border-radius:18px;background:#02070c;color:#bfe8ff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a{padding:11px 15px;border-radius:999px;border:1px solid #ffffff20;background:#ffffff08;color:#fff;cursor:pointer;text-decoration:none}a{color:#7ed8ff}@media(max-width:650px){.map{grid-template-columns:1fr 1fr}.node{min-height:115px}}@media(max-width:430px){.map{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="ey">VETERAN MISSION · PUBLIC GAME</div><h1>Rebuild<br>the map.</h1><p class="lede">Navigate the transition from service to a sustainable civilian life. The intended sequence is Service → Records → Capacity → Pathway → Resources → Life.</p><div class="stats"><div class="stat">Progress <b id="score">0</b>/6</div><div class="stat">Attempts <b id="tries">0</b></div></div><div class="map" id="map"></div><div class="mission" id="mission">Choose the next node in the map.</div><div class="actions"><button onclick="shuffle()">Shuffle</button><button onclick="resetGame()">Reset</button><a href="/veterans/">Veteran Commons →</a><a href="/games/">Games →</a></div></main><script>const nodes=[['1','SERVICE','Your military identity is more than a job title.','Record the roles, skills, environments and responsibilities you actually performed.'],['2','RECORDS','Build the evidence spine.','Connect service records, medical records, orders, evaluations and dates.'],['3','CAPACITY','Map the person after service.','Identify current strengths, constraints, accommodations and variable capacity.'],['4','PATHWAY','Translate capability into civilian options.','Compare work, training, education, self-employment and independent-living paths.'],['5','RESOURCES','Attach the right institutional doors.','Connect benefits, housing, health, education, family and employment resources.'],['6','LIFE','Measure the real outcome.','Did the pathway produce a life that is more stable, autonomous and aligned with the person?']];let order=[...nodes],active=null,score=0,tries=0;function render(){map.innerHTML='';order.forEach(n=>{const b=document.createElement('button');b.className='node'+(active===n[0]?' active':'');b.innerHTML='<small>NODE '+n[0]+'</small><b>'+n[1]+'</b><br><br>'+n[2];b.onclick=()=>select(n);map.appendChild(b)})}function select(n){active=n[0];tries++;document.getElementById('tries').textContent=tries;mission.innerHTML='<b>'+n[1]+'</b><br>'+n[3];if(score+1===Number(n[0])){score++;document.getElementById('score').textContent=score;if(score===6)mission.innerHTML+='<br><br><b>MAP COMPLETE.</b> The next map is the life you build from here.'}render()}function shuffle(){order.sort(()=>Math.random()-.5);render();mission.textContent='Map shuffled. Find the next useful node.'}function resetGame(){score=tries=0;active=null;document.getElementById('score').textContent=0;document.getElementById('tries').textContent=0;mission.textContent='Choose the next node in the map.';render()}render();</script></body></html>
