<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10191a">
<meta name="description" content="A strange illustrated world. Look closely.">
<title>Mirror Cartographer — The Unfinished Country</title>
<style>
:root{color-scheme:dark;--night:#10191a;--bone:#e8d8b9;--rust:#b96c55;--moss:#849879;--water:#527b7b;--gold:#d8b477}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--bone)}
body{overflow-x:hidden;font-family:Georgia,serif}
button,a{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #f5d99c;outline-offset:5px}
.world{position:relative;min-height:100svh;overflow:hidden;background:#10191a}
.world:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.17;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");mix-blend-mode:screen}
.topline{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 28px;color:#d6c7a9;font:9px/1.2 "Courier New",monospace;letter-spacing:.19em;text-transform:uppercase;pointer-events:none}
.topline a{pointer-events:auto;color:inherit;text-decoration:none;border-bottom:1px solid #d6c7a955;padding-bottom:5px}
.topline .sig{display:flex;align-items:center;gap:12px}
.sig-mark{width:22px;height:22px;border:1px solid #c49b70;border-radius:50% 42% 50% 38%;transform:rotate(-27deg);position:relative}
.sig-mark:after{content:"";position:absolute;inset:5px;border:1px solid #c49b70;border-radius:50%}
.scene{display:block;width:100%;height:100svh;min-height:650px;max-height:1100px}
svg text{user-select:none}
.relic{cursor:pointer;outline:none}
.relic .halo{opacity:0;transition:opacity .35s}
.relic:hover .halo,.relic:focus .halo,.relic:focus-visible .halo{opacity:1}
.relic:focus-visible{filter:drop-shadow(0 0 8px #f3d99b)}
.moon{transform-origin:1180px 190px;animation:moon-breathe 9s ease-in-out infinite alternate}
.waterline{animation:water 11s ease-in-out infinite alternate;transform-origin:center}
.lantern{animation:float 5.5s ease-in-out infinite alternate}
.lantern:nth-of-type(2n){animation-delay:-2.7s}
.leaf-sway{transform-box:fill-box;transform-origin:bottom;animation:leaf 7s ease-in-out infinite alternate}
.firefly{animation:firefly 4s ease-in-out infinite alternate}
.firefly:nth-child(2n){animation-delay:-2s}
@keyframes moon-breathe{to{transform:scale(1.035)}}
@keyframes water{to{transform:translateX(16px)}}
@keyframes float{to{transform:translateY(-13px)}}
@keyframes leaf{to{transform:rotate(3deg)}}
@keyframes firefly{to{opacity:.18;transform:translate(5px,-8px)}}
.inscription{position:absolute;z-index:4;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:13px;color:#c6b89d;font:8px "Courier New",monospace;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;opacity:.78}
.inscription:before,.inscription:after{content:"";width:38px;height:1px;background:#c6b89d66}
.reveal{position:absolute;z-index:7;left:50%;bottom:72px;transform:translate(-50%,16px);width:min(420px,calc(100% - 38px));padding:18px 22px 20px;border:1px solid #d8b47777;background:#172021eF;color:#eadbbd;box-shadow:8px 8px 0 #090e0f;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
.reveal.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.reveal small{display:block;margin-bottom:10px;color:#c18a6d;font:8px "Courier New",monospace;letter-spacing:.2em;text-transform:uppercase}
.reveal p{margin:0;font:italic 19px/1.3 Georgia,serif}
.reveal button{position:absolute;top:8px;right:9px;border:0;background:none;color:#e8d8b9;font:18px Georgia;cursor:pointer}
.exit{position:absolute;z-index:5;right:27px;bottom:25px;color:#d6c7a9;text-decoration:none;font:8px "Courier New",monospace;letter-spacing:.17em;border-bottom:1px solid #d6c7a955;padding-bottom:5px}
@media(max-width:700px){
 .topline{padding:16px 15px;font-size:8px}
 .scene{height:86svh;min-height:600px;max-height:850px}
 .inscription{bottom:17px;font-size:7px;letter-spacing:.13em}
 .inscription:before,.inscription:after{width:18px}
 .exit{right:15px;bottom:52px;font-size:7px}
 .reveal{bottom:90px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

 <div class="reveal" id="reveal" role="status" aria-live="polite"><button type="button" id="closeReveal" aria-label="Close">×</button><small id="revealTitle"></small><p id="revealCopy"></p></div>
 <a class="exit" href="./living-atlas.html">wander further ↗</a>

<script>
(()=>{
 const panel=document.getElementById('reveal'),title=document.getElementById('revealTitle'),copy=document.getElementById('revealCopy');
 const close=()=>panel.classList.remove('open');
 document.getElementById('closeReveal').addEventListener('click',close);
 document.querySelectorAll('.relic').forEach(item=>{
  const open=()=>{title.textContent=item.dataset.title;copy.textContent=item.dataset.copy;panel.classList.add('open')};
  item.addEventListener('click',open);
  item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>
